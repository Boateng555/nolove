{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fdf6f4">
    <title>{% block title %}For You{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}{% if site.background_image %} has-bg-photo{% endif %}">
    {% if site.background_image %}
    <img
        class="page-bg"
        src="{{ site.background_image.url }}"
        alt=""
        aria-hidden="true"
    >
    <div class="page-bg-overlay" aria-hidden="true"></div>
    {% endif %}

    {% block decorations %}{% endblock %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
